<IfModule !mod_auth_cas.c>
    LoadModule auth_cas_module /usr/lib/apache2/modules/mod_auth_cas.so
</IfModule>
CASCookiePath /var/cache/apache2/mod_auth_cas/
CASCertificatePath /etc/ssl/certs
CASRootProxiedAs https://localhost:${APP_HTTPS_PORT}
CASLoginURL https://idp-stg.login.iu.edu/idp/profile/cas/login
CASValidateURL https://idp-stg.login.iu.edu/idp/profile/cas/serviceValidate
CASProxyValidateURL https://idp-stg.login.iu.edu/idp/profile/cas/proxyValidate
